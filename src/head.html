<title>Fretboard Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iOS / macOS app. Frosted sidebar of stages, grouped inset cards on the right,
   SF Pro type, iOS blue as the tint for everything tappable, system colours for meaning
   (orange = root, green = right, red = wrong, yellow = play here). The fretboard stays wood. */
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.08);
  --ink: #000000; --muted: rgba(60,60,67,.62); --faint: rgba(60,60,67,.32); --line: rgba(60,60,67,.14);
  --tint: #007AFF; --tint-ink: #FFFFFF; --tint-soft: rgba(0,122,255,.12);
  --brass: #FF9500; --brass-soft: rgba(255,149,0,.14);
  --teal: #30B0C7; --minor: #AF52DE; --good: #34C759; --good-ink: #1E7B34; --good-soft: rgba(52,199,89,.15);
  --bad: #FF3B30; --bad-ink: #C4261D; --bad-soft: rgba(255,59,48,.12);
  --target: #FFCC00;
  --wood: #2F2724; --fret: #BDB5AA; --string: #ECE5D8; --inlay: rgba(236,229,216,.24); --ghost: rgba(255,255,255,.2);
  --seg-on: #FFFFFF; --rail: rgba(246,246,248,.78); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  --f-mono: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #1C1C1E; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16);
  --ink: #FFFFFF; --muted: rgba(235,235,245,.62); --faint: rgba(235,235,245,.3); --line: rgba(84,84,88,.55);
  --tint: #0A84FF; --tint-ink: #FFFFFF; --tint-soft: rgba(10,132,255,.2);
  --brass: #FF9F0A; --brass-soft: rgba(255,159,10,.2);
  --teal: #40C8E0; --minor: #BF5AF2; --good: #30D158; --good-ink: #30D158; --good-soft: rgba(48,209,88,.18);
  --bad: #FF453A; --bad-ink: #FF6961; --bad-soft: rgba(255,69,58,.18);
  --target: #FFD60A;
  --wood: #2A2320; --fret: #A39C92; --string: #DDD6C9; --inlay: rgba(236,229,216,.18); --ghost: rgba(255,255,255,.16);
  --seg-on: #636366; --rail: rgba(28,28,30,.78); --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16);
  --ink: #FFFFFF; --muted: rgba(235,235,245,.62); --faint: rgba(235,235,245,.3); --line: rgba(84,84,88,.55);
  --tint: #0A84FF; --tint-ink: #FFFFFF; --tint-soft: rgba(10,132,255,.2);
  --brass: #FF9F0A; --brass-soft: rgba(255,159,10,.2);
  --teal: #40C8E0; --minor: #BF5AF2; --good: #30D158; --good-ink: #30D158; --good-soft: rgba(48,209,88,.18);
  --bad: #FF453A; --bad-ink: #FF6961; --bad-soft: rgba(255,69,58,.18);
  --target: #FFD60A;
  --wood: #2A2320; --fret: #A39C92; --string: #DDD6C9; --inlay: rgba(236,229,216,.18); --ghost: rgba(255,255,255,.16);
  --seg-on: #636366; --rail: rgba(28,28,30,.78); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.47 var(--f-body); letter-spacing: -.005em; margin: 0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--tint); }
:focus-visible { outline: 3px solid var(--tint-soft); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -.022em; }
h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.015em; }
h3 { font-size: 1.04rem; font-weight: 600; letter-spacing: -.01em; }
.eyebrow { font: 600 .74rem/1.2 var(--f-body); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
p { margin: 0; }

/* Shell */
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--line); padding: 22px 12px 28px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { flex: none; border-radius: 7px; }
.brand b { font: 700 1.05rem var(--f-display); letter-spacing: -.015em; }
.save { font: .74rem/1.3 var(--f-body); color: var(--muted); padding: 0 8px; }
.group-name { font: 600 .72rem/1 var(--f-body); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 6px; }
.stage-btn { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 7px 10px; }
.stage-btn:hover { background: var(--fill-2); }
.stage-btn[aria-current="page"] { background: var(--tint); color: var(--tint-ink); }
.stage-btn[aria-current="page"] .num { background: rgba(255,255,255,.25); color: #fff; }
.stage-btn .num { font: 600 .72rem/1 var(--f-round); color: var(--muted); background: var(--fill); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.stage-btn .t { font-size: .9rem; line-height: 1.25; font-weight: 500; }
.chip { font: 600 .68rem/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.chip.passed { background: var(--good-soft); color: var(--good-ink); }
.chip.started { background: var(--fill); color: var(--muted); }
.chip.current { background: var(--tint-soft); color: var(--tint); }
.stage-btn[aria-current="page"] .chip { background: rgba(255,255,255,.25); color: #fff; }
.main { min-width: 0; padding: 30px clamp(16px, 4vw, 52px) 120px; display: flex; flex-direction: column; gap: 22px; max-width: 1160px; }
.home-link { background: none; border: 0; padding: 8px 10px; border-radius: 9px; text-align: left; font-weight: 600; }
.home-link:hover { background: var(--fill-2); }
.home-link[aria-current="page"] { background: var(--tint); color: var(--tint-ink); }

/* Generic pieces */
.card { background: var(--surface); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.btn { border: 0; background: var(--tint-soft); color: var(--tint); border-radius: 12px; padding: 9px 16px; font-weight: 600; transition: filter .15s, transform .1s; }
.btn:hover { filter: brightness(.96); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--tint); color: var(--tint-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 14px 24px; font-size: 1.04rem; border-radius: 14px; }
.btn.ghost { background: none; color: var(--tint); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.tabs { display: inline-flex; align-self: flex-start; gap: 2px; background: var(--fill); border-radius: 10px; padding: 2px; overflow-x: auto; max-width: 100%; }
.tab { background: none; border: 0; border-radius: 8px; padding: 7px 16px; font-weight: 600; font-size: .9rem; color: var(--ink); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 12px; font-size: .84rem; font-weight: 600; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
ul.points { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 9px; max-width: 70ch; }
ul.points li::marker { color: var(--tint); }
select { font: inherit; font-weight: 500; padding: 6px 10px; border-radius: 9px; border: 0; background: var(--fill); color: var(--ink); }
details summary { color: var(--tint) !important; font-weight: 500; }

/* Fretboard */
.fb-wrap { overflow-x: auto; }
.fb { display: block; width: 100%; min-width: 520px; height: auto; }
.fb .cell { fill: transparent; cursor: pointer; }
.fb .cell:hover { fill: rgba(255,204,0,.3); }
.fb .cell.off { cursor: default; }
.fb .cell.off:hover { fill: transparent; }
.fig-caption { font-size: .85rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* Quiz */
.quiz-q { font-size: 1.15rem; font-weight: 500; letter-spacing: -.01em; max-width: 70ch; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.choices.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.choice { text-align: left; border: 0; background: var(--fill-2); border-radius: 12px; padding: 12px 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; transition: background .15s, transform .1s; }
.choice:hover:not(:disabled) { background: var(--tint-soft); }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice:disabled { cursor: default; }
.choice .k { font: 600 .72rem var(--f-round); color: var(--faint); }
.choice.right { background: var(--good-soft); color: var(--good-ink); box-shadow: inset 0 0 0 2px var(--good); }
.choice.wrong { background: var(--bad-soft); color: var(--bad-ink); box-shadow: inset 0 0 0 2px var(--bad); }
.feedback { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback b { font-weight: 700; }
.scoreline { font: 500 .85rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Metronome + callout */
.metro { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--fill-2); border-radius: var(--r); padding: 12px 14px; }
.metro .btn:not(.primary) { width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 1.2rem; line-height: 1; }
.metro .bpm { font: 600 1.7rem var(--f-round); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; letter-spacing: -.02em; }
.beats { display: flex; gap: 7px; }
.beats i { width: 11px; height: 11px; border-radius: 50%; background: var(--fill); transition: background .05s, transform .05s; }
.beats i.on { background: var(--tint); transform: scale(1.15); }
.beats i.on.accent { background: var(--brass); }
.callout { background: var(--fill-2); border-radius: var(--r); padding: 18px; text-align: center; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.call-head { display: flex; align-items: baseline; justify-content: center; gap: 14px; flex-wrap: wrap; }
.call-board:empty { display: none; }
.callout .big { font: 700 clamp(2.6rem, 7vw, 4.4rem)/1 var(--f-display); letter-spacing: -.035em; }
.callout .where { font: 500 .95rem var(--f-body); color: var(--muted); }
.callout .ans { font: 600 1rem var(--f-body); color: var(--good-ink); min-height: 1.4em; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.level { text-align: left; border: 0; border-radius: 12px; padding: 11px 13px; background: var(--fill-2); display: flex; flex-direction: column; gap: 3px; transition: background .15s; }
.level:hover { background: var(--fill); }
.level[aria-pressed="true"] { background: var(--tint-soft); box-shadow: inset 0 0 0 2px var(--tint); }
.level .lv { font: 600 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); display: flex; justify-content: space-between; }
.level[aria-pressed="true"] .lv { color: var(--tint); }
.level .done { color: var(--good-ink); }
ol.how { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 7px; max-width: 72ch; }
ol.how li::marker { color: var(--tint); font-weight: 700; }

/* Home */
.today { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.today .lead { display: flex; flex-direction: column; gap: 16px; }
.plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.plan > div { padding: 12px 14px; background: var(--fill-2); border-radius: 12px; }
.plan .m { font: 700 1.2rem var(--f-round); letter-spacing: -.02em; }
.plan .l { font-size: .8rem; color: var(--muted); }
.week { display: flex; flex-direction: column; }
.week .item { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); }
.week .item:first-child { border-top: 0; padding-top: 4px; }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat > div { display: flex; flex-direction: column; background: var(--fill-2); border-radius: 12px; padding: 12px 14px; }
.stat .v { font: 700 1.45rem var(--f-round); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .78rem; color: var(--muted); }
.track { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--fill-2); padding: 10px 12px; border-radius: 12px; }
.track code { font: 600 .95rem var(--f-body); }
.rule { font: 600 1.4rem/1.3 var(--f-display); letter-spacing: -.015em; max-width: 46ch; }

/* Session */
.blocks { display: grid; gap: 4px; }
.blk { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.blk > i { display: block; height: 100%; background: var(--tint); width: 0; border-radius: 3px; }
.blk-labels { display: grid; gap: 4px; font: 500 .74rem/1.2 var(--f-body); color: var(--muted); }
.blk-labels .on { color: var(--tint); font-weight: 700; }
.clock { font: 200 clamp(2.8rem, 7vw, 4.2rem)/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.session-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.timeup { background: var(--tint-soft); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }

.test-result { display: flex; flex-direction: column; gap: 14px; }
.missed { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.badge { display: inline-block; font: 600 .78rem var(--f-body); padding: 5px 10px; border-radius: 999px; }
.badge.ok { background: var(--good-soft); color: var(--good-ink); }
.badge.no { background: var(--bad-soft); color: var(--bad-ink); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .today { grid-template-columns: 1fr; }
}
@media (max-width: 520px) { .plan { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pulse { 0%, 100% { stroke-opacity: .9; } 50% { stroke-opacity: .25; } }
.fb .pulse { animation: pulse 1.1s ease-in-out infinite; }

/* Lessons */
.lesson { display: flex; flex-direction: column; gap: 10px; }
.lesson p { max-width: 68ch; }
.lesson-h { display: flex; align-items: center; gap: 12px; }
.lesson-n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); font: 700 .85rem/28px var(--f-round); text-align: center; }
.example { background: var(--tint-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; max-width: 76ch; }
.example .eyebrow { color: var(--tint); }
.tbl-wrap { overflow-x: auto; }
table.mini { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: .9rem; background: var(--fill-2); border-radius: 12px; overflow: hidden; }
table.mini th, table.mini td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.mini tr:last-child th, table.mini tr:last-child td { border-bottom: 0; }
table.mini thead th { font-size: .74rem; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); font-weight: 600; }
table.mini tbody th { font-weight: 600; color: var(--muted); }
.recap { display: flex; flex-direction: column; gap: 10px; }

/* Account + sign-in */
.account { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: .75rem; color: var(--faint); }
.account .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.signout { border: 0; background: none; padding: 0; font-size: .75rem; color: var(--faint); text-decoration: underline; text-underline-offset: 2px; }
.signout:hover { color: var(--muted); }
.login-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.login-form input { font: inherit; font-size: 1.05rem; padding: 13px 14px; border-radius: 12px; border: 0; background: var(--fill); color: var(--ink); width: 100%; }
.login-form input:focus { outline: 3px solid var(--tint-soft); }
.sent { align-items: center; text-align: center; width: 100%; }
.spam-note { background: var(--brass-soft); border-radius: 12px; padding: 12px 14px; text-align: left; font-size: .92rem; }
.small { font-size: .82rem; }
.app.login-mode { grid-template-columns: 1fr; }
.login { min-height: 90vh; display: grid; place-items: center; width: 100%; }
.login-card { max-width: 420px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 36px 28px; }
.btn.google { display: inline-flex; align-items: center; gap: 10px; justify-content: center; width: 100%; }
.btn.google svg { background: #fff; border-radius: 50%; padding: 2px; width: 22px; height: 22px; }
</style>
