   SF Pro type, iOS blue as the tint for everything tappable, system colours for meaning
   (orange = root, green = right, red = wrong, yellow = play here). The fretboard stays wood. */
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.08);
  --ink: #000000; --muted: rgba(60,60,67,.62); --faint: rgba(60,60,67,.32); --line: rgba(60,60,67,.14);
  --tint: #007AFF; --tint-ink: #FFFFFF; --tint-soft: rgba(0,122,255,.12);
  --brass: #FF9500; --brass-soft: rgba(255,149,0,.14);

  --bad: #FF3B30; --bad-ink: #C4261D; --bad-soft: rgba(255,59,48,.12);
  --target: #FFCC00;
  --wood: #2F2724; --fret: #BDB5AA; --string: #ECE5D8; --inlay: rgba(236,229,216,.24); --ghost: rgba(255,255,255,.2);
  --seg-on: #FFFFFF; --rail: rgba(246,246,248,.78); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  --f-mono: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #1C1C1E; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16);
  --ink: #FFFFFF; --muted: rgba(235,235,245,.62); --faint: rgba(235,235,245,.3); --line: rgba(84,84,88,.55);
  --tint: #0A84FF; --tint-ink: #FFFFFF; --tint-soft: rgba(10,132,255,.2);
  --brass: #FF9F0A; --brass-soft: rgba(255,159,10,.2);
  --teal: #40C8E0; --minor: #BF5AF2; --good: #30D158; --good-ink: #30D158; --good-soft: rgba(48,209,88,.18);

  --seg-on: #636366; --rail: rgba(28,28,30,.78); --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16);
  --ink: #FFFFFF; --muted: rgba(235,235,245,.62); --faint: rgba(235,235,245,.3); --line: rgba(84,84,88,.55);
  --tint: #0A84FF; --tint-ink: #FFFFFF; --tint-soft: rgba(10,132,255,.2);
  --brass: #FF9F0A; --brass-soft: rgba(255,159,10,.2);
  --teal: #40C8E0; --minor: #BF5AF2; --good: #30D158; --good-ink: #30D158; --good-soft: rgba(48,209,88,.18);
  --bad: #FF453A; --bad-ink: #FF6961; --bad-soft: rgba(255,69,58,.18);
  --target: #FFD60A;
  --wood: #2A2320; --fret: #A39C92; --string: #DDD6C9; --inlay: rgba(236,229,216,.18); --ghost: rgba(255,255,255,.16);
  --seg-on: #636366; --rail: rgba(28,28,30,.78); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.47 var(--f-body); letter-spacing: -.005em; margin: 0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--tint); }
:focus-visible { outline: 3px solid var(--tint-soft); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -.022em; }
h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.015em; }
h3 { font-size: 1.04rem; font-weight: 600; letter-spacing: -.01em; }
.eyebrow { font: 600 .74rem/1.2 var(--f-body); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
p { margin: 0; }

/* Shell */
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--line); padding: 22px 12px 28px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { flex: none; border-radius: 7px; }
.brand b { font: 700 1.05rem var(--f-display); letter-spacing: -.015em; }
.save { font: .74rem/1.3 var(--f-body); color: var(--muted); padding: 0 8px; }
.group-name { font: 600 .72rem/1 var(--f-body); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 6px; }
.stage-btn { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 7px 10px; }
.stage-btn:hover { background: var(--fill-2); }
.stage-btn[aria-current="page"] { background: var(--tint); color: var(--tint-ink); }
.stage-btn[aria-current="page"] .num { background: rgba(255,255,255,.25); color: #fff; }
.stage-btn .num { font: 600 .72rem/1 var(--f-round); color: var(--muted); background: var(--fill); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.stage-btn .t { font-size: .9rem; line-height: 1.25; font-weight: 500; }
.chip { font: 600 .68rem/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.chip.passed { background: var(--good-soft); color: var(--good-ink); }
.chip.started { background: var(--fill); color: var(--muted); }
.chip.current { background: var(--tint-soft); color: var(--tint); }
.stage-btn[aria-current="page"] .chip { background: rgba(255,255,255,.25); color: #fff; }
.main { min-width: 0; padding: 30px clamp(16px, 4vw, 52px) 120px; display: flex; flex-direction: column; gap: 22px; max-width: 1160px; }
.home-link { background: none; border: 0; padding: 8px 10px; border-radius: 9px; text-align: left; font-weight: 600; }
.home-link:hover { background: var(--fill-2); }
.home-link[aria-current="page"] { background: var(--tint); color: var(--tint-ink); }

/* Generic pieces */
.card { background: var(--surface); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.btn { border: 0; background: var(--tint-soft); color: var(--tint); border-radius: 12px; padding: 9px 16px; font-weight: 600; transition: filter .15s, transform .1s; }
.btn:hover { filter: brightness(.96); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--tint); color: var(--tint-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 14px 24px; font-size: 1.04rem; border-radius: 14px; }
.btn.ghost { background: none; color: var(--tint); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.tabs { display: inline-flex; align-self: flex-start; gap: 2px; background: var(--fill); border-radius: 10px; padding: 2px; overflow-x: auto; max-width: 100%; }
.tab { background: none; border: 0; border-radius: 8px; padding: 7px 16px; font-weight: 600; font-size: .9rem; color: var(--ink); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 12px; font-size: .84rem; font-weight: 600; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
ul.points { margin: 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 9px; max-width: 70ch; }
ul.points li::marker { color: var(--tint); }
select { font: inherit; font-weight: 500; padding: 6px 10px; border-radius: 9px; border: 0; background: var(--fill); color: var(--ink); }
details summary { color: var(--tint) !important; font-weight: 500; }

/* Fretboard */
.fb-wrap { overflow-x: auto; }
.fb { display: block; width: 100%; min-width: 520px; height: auto; }
.fb .cell { fill: transparent; cursor: pointer; }
.fb .cell:hover { fill: rgba(255,204,0,.3); }
.fb .cell.off { cursor: default; }
.fb .cell.off:hover { fill: transparent; }
.fig-caption { font-size: .85rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* Quiz */
.quiz-q { font-size: 1.15rem; font-weight: 500; letter-spacing: -.01em; max-width: 70ch; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.choices.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.choice { text-align: left; border: 0; background: var(--fill-2); border-radius: 12px; padding: 12px 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; transition: background .15s, transform .1s; }
.choice:hover:not(:disabled) { background: var(--tint-soft); }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice:disabled { cursor: default; }
.choice .k { font: 600 .72rem var(--f-round); color: var(--faint); }
.choice.right { background: var(--good-soft); color: var(--good-ink); box-shadow: inset 0 0 0 2px var(--good); }
.choice.wrong { background: var(--bad-soft); color: var(--bad-ink); box-shadow: inset 0 0 0 2px var(--bad); }
.feedback { border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback b { font-weight: 700; }
.scoreline { font: 500 .85rem var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Metronome + callout */
.metro { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--fill-2); border-radius: var(--r); padding: 12px 14px; }
.metro .btn:not(.primary) { width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 1.2rem; line-height: 1; }
.metro .bpm { font: 600 1.7rem var(--f-round); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; letter-spacing: -.02em; }
.beats { display: flex; gap: 7px; }
.beats i { width: 11px; height: 11px; border-radius: 50%; background: var(--fill); transition: background .05s, transform .05s; }
.beats i.on { background: var(--tint); transform: scale(1.15); }
.beats i.on.accent { background: var(--brass); }
.callout { background: var(--fill-2); border-radius: var(--r); padding: 18px; text-align: center; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.call-head { display: flex; align-items: baseline; justify-content: center; gap: 14px; flex-wrap: wrap; }
.call-board:empty { display: none; }
.callout .big { font: 700 clamp(2.6rem, 7vw, 4.4rem)/1 var(--f-display); letter-spacing: -.035em; }
.callout .where { font: 500 .95rem var(--f-body); color: var(--muted); }
.callout .ans { font: 600 1rem var(--f-body); color: var(--good-ink); min-height: 1.4em; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.level { text-align: left; border: 0; border-radius: 12px; padding: 11px 13px; background: var(--fill-2); display: flex; flex-direction: column; gap: 3px; transition: background .15s; }
.level:hover { background: var(--fill); }
.level[aria-pressed="true"] { background: var(--tint-soft); box-shadow: inset 0 0 0 2px var(--tint); }
.level .lv { font: 600 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .02em; color: var(--muted); display: flex; justify-content: space-between; }
.level[aria-pressed="true"] .lv { color: var(--tint); }
.level .done { color: var(--good-ink); }
ol.how { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 7px; max-width: 72ch; }
ol.how li::marker { color: var(--tint); font-weight: 700; }

/* Home */
.today { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.today .lead { display: flex; flex-direction: column; gap: 16px; }
.plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.plan > div { padding: 12px 14px; background: var(--fill-2); border-radius: 12px; }
.plan .m { font: 700 1.2rem var(--f-round); letter-spacing: -.02em; }
.plan .l { font-size: .8rem; color: var(--muted); }
.week { display: flex; flex-direction: column; }
.week .item { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); }
.week .item:first-child { border-top: 0; padding-top: 4px; }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat > div { display: flex; flex-direction: column; background: var(--fill-2); border-radius: 12px; padding: 12px 14px; }
.stat .v { font: 700 1.45rem var(--f-round); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .78rem; color: var(--muted); }
.track { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--fill-2); padding: 10px 12px; border-radius: 12px; }
.track code { font: 600 .95rem var(--f-body); }
.rule { font: 600 1.4rem/1.3 var(--f-display); letter-spacing: -.015em; max-width: 46ch; }

/* Session */
.blocks { display: grid; gap: 4px; }
.blk { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.blk > i { display: block; height: 100%; background: var(--tint); width: 0; border-radius: 3px; }
.blk-labels { display: grid; gap: 4px; font: 500 .74rem/1.2 var(--f-body); color: var(--muted); }
.blk-labels .on { color: var(--tint); font-weight: 700; }
.clock { font: 200 clamp(2.8rem, 7vw, 4.2rem)/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.session-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.timeup { background: var(--tint-soft); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }

.test-result { display: flex; flex-direction: column; gap: 14px; }
.missed { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.badge { display: inline-block; font: 600 .78rem var(--f-body); padding: 5px 10px; border-radius: 999px; }
.badge.ok { background: var(--good-soft); color: var(--good-ink); }
.badge.no { background: var(--bad-soft); color: var(--bad-ink); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .today { grid-template-columns: 1fr; }
}
@media (max-width: 520px) { .plan { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pulse { 0%, 100% { stroke-opacity: .9; } 50% { stroke-opacity: .25; } }
.fb .pulse { animation: pulse 1.1s ease-in-out infinite; }
[hidden] { display: none !important; }
.path { display: flex; flex-direction: column; gap: 6px; }
.path-cap { font: 600 15px/1.3 var(--f-round); font-variant-numeric: tabular-nums; }
.path-cap .muted { font-weight: 400; margin-left: 8px; }

/* Lessons */
.lesson { display: flex; flex-direction: column; gap: 10px; }
.lesson p { max-width: 68ch; }
.lesson-h { display: flex; align-items: center; gap: 12px; }
.lesson-n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); font: 700 .85rem/28px var(--f-round); text-align: center; }
.example { background: var(--tint-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; max-width: 76ch; }
.example .eyebrow { color: var(--tint); }
.tbl-wrap { overflow-x: auto; }
table.mini { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: .9rem; background: var(--fill-2); border-radius: 12px; overflow: hidden; }
table.mini th, table.mini td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.mini tr:last-child th, table.mini tr:last-child td { border-bottom: 0; }
table.mini thead th { font-size: .74rem; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); font-weight: 600; }
table.mini tbody th { font-weight: 600; color: var(--muted); }
.recap { display: flex; flex-direction: column; gap: 10px; }

/* Account + sign-in */
.account { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: .75rem; color: var(--faint); }
.account .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.signout { border: 0; background: none; padding: 0; font-size: .75rem; color: var(--faint); text-decoration: underline; text-underline-offset: 2px; }
.signout:hover { color: var(--muted); }
.login-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.login-form input { font: inherit; font-size: 1.05rem; padding: 13px 14px; border-radius: 12px; border: 0; background: var(--fill); color: var(--ink); width: 100%; }
.login-form input:focus { outline: 3px solid var(--tint-soft); }
.sent { align-items: center; text-align: center; width: 100%; }
.spam-note { background: var(--brass-soft); border-radius: 12px; padding: 12px 14px; text-align: left; font-size: .92rem; }
.small { font-size: .82rem; }
.app.login-mode { grid-template-columns: 1fr; }
.login { min-height: 90vh; display: grid; place-items: center; width: 100%; }
.login-card { max-width: 420px; width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 36px 28px; }
.btn.google { display: inline-flex; align-items: center; gap: 10px; justify-content: center; width: 100%; }
.btn.google svg { background: #fff; border-radius: 50%; padding: 2px; width: 22px; height: 22px; }
</style>

      const d = 1 + rnd(6); const name = G.chordName(d, k);
      return { type: 'choice', prompt: `In <b>${kn(k)}</b>, <b>${name}</b> is chord number…`, choices: DEG_CHOICES, answer: d, explain: `${kn(k)}: ${list}` };
    }
    const d = 1 + rnd(7);
    const q = G.QUAL[d - 1];
    return { type: 'choice', prompt: `In any major key, chord <b>${d}</b> is…`, choices: [{ label: 'Major', value: 'M' }, { label: 'Minor', value: 'm' }, { label: 'Diminished', value: 'dim' }], answer: q, explain: '1, 4, 5 are major. 2, 3, 6 are minor. 7 is diminished (played as m7♭5).' };
  }

  /* ---------- Roadmaps (stages 5, 6) ---------- */
  const RM_KEYS = { 1: [7, 9, 5, 8, 6], 2: [0, 2, 4, 11, 10, 3, 1] };
  function rmBoard(n, k, opts = {}) {
    const r = G.roadmap(n, k);
    const dots = r.dots.map((d) => ({ ...d, kind: d.deg === 1 ? 'root' : 'note', text: String(d.deg) }));
    return { r, spec: { lo: Math.max(0, r.root - 2), hi: Math.min(17, r.root + 8), dots, ...opts } };
  }
  function qRoadmap(n) {
    return function () {
      const t = weighted([[40, 'click'], [30, 'which'], [20, 'shape'], ...(n === 2 ? [[15, 'pick']] : [])]);
      const k = weighted([[75, pick(RM_KEYS[n])], [25, pick(ALL_KEYS)]]);
      const r = G.roadmap(n, k);
      if (t === 'pick') {
        const kk = pick(ALL_KEYS); const b = G.bestRoadmap(kk);
        return { type: 'choice', prompt: `Key of <b>${G.keyName(kk)}</b>. Which roadmap keeps your hand lowest on the neck?`, choices: [{ label: 'Roadmap 1 (root on low E)', value: 1 }, { label: 'Roadmap 2 (root on A)', value: 2 }], answer: b, explain: `${G.keyName(kk)} sits at fret ${G.fretOf(kk, 0, 1)} on low E and fret ${G.fretOf(kk, 1, 1)} on A. Pick the lower one.` };
      }
      if (t === 'click') {
        const d = 2 + rnd(6); const target = r.dots.find((x) => x.deg === d);
        const lo = Math.max(0, r.root - 2), hi = Math.min(17, r.root + 8);
        return {
          type: 'click', prompt: `<b>Roadmap ${n}</b> in <b>${kn(k)}</b>. Chord 1 is shown. Click the root of chord <b>${d}</b> (${G.chordName(d, k)}).`,
          board: { lo, hi, dots: [{ ...r.dots[0], kind: 'root', text: '1' }] },
          isCorrect: (cs, cf) => cs === target.s && (cf === target.f || cf === target.f - 12 || cf === target.f + 12),
          solution: [{ s: target.s, f: target.f, kind: 'right', text: String(d) }],
          explain: `Roadmap ${n}: ${n === 1 ? '1-2-3 along low E, 4-5-6 right above on A, 7 two frets further.' : '1-2-3-4 along A, 5-6-7-1 right below on low E.'}`,
        };
      }
      if (t === 'which') {
        const target = pick(r.dots.filter((x) => x.deg !== 1));
        const dots = r.dots.map((x) => ({ ...x, kind: x === target ? 'target' : x.deg === 1 && x === r.dots[0] ? 'root' : 'ghost', text: x === target ? '?' : x === r.dots[0] ? '1' : '' }));
        return { type: 'choice', prompt: `<b>Roadmap ${n}</b> in <b>${kn(k)}</b>. Which chord number is the highlighted root?`, board: { lo: Math.max(0, r.root - 2), hi: Math.min(17, r.root + 8), dots }, choices: DEG_CHOICES, answer: target.deg, explain: `That's chord ${target.deg}: ${G.chordName(target.deg, k)}.` };
      }
      const d = 1 + rnd(7);
      const shape = G.shapeFor(n, d);
      const pool = ['E-shape major', 'E-shape minor', 'A-shape major', 'A-shape minor', 'm7♭5 shape'].map((l) => ({ label: l, value: l }));
      return { type: 'choice', prompt: `<b>Roadmap ${n}</b>: which barre shape plays chord <b>${d}</b> in its main spot (not a shortcut)?`, choices: four({ label: shape, value: shape }, pool), answer: shape, explain: `Chord ${d} is ${d === 7 ? 'the m7♭5' : G.QUAL_WORD[G.QUAL[d - 1]]} and its main root spot is on the ${G.roadmap(n, 0).dots.find((x) => x.deg === d).s === 0 ? 'low E' : 'A'} string.` };
    };
  }

  /* ---------- Stage 7: keystones ---------- */
  function q7() {
    const t = weighted([[45, 'click'], [30, 'which'], [25, 'nums']]);
    const k = pick(ALL_KEYS);
    if (t === 'nums') {
      const w = pick(['white', 'black']);
      return { type: 'choice', prompt: `The <b>${w}</b> keystone is the 1-fret step between which numbers?`, choices: shuffle(['3 → 4', '7 → 1', '1 → 2', '5 → 6'].map((l) => ({ label: l, value: l }))), answer: w === 'white' ? '3 → 4' : '7 → 1', explain: 'White keystone = 3 → 4. Black keystone = 7 → 1. They are the only 1-fret steps in the major scale.' };
    }
    const s = pick([5, 0]);
    const ks = G.keystones(s, k);
    if (t === 'click') {
      const w = pick(['white', 'black']);
      const targets = ks.filter((x) => x.type === w);
      return {
        type: 'click', prompt: `Key of <b>${G.keyName(k)}</b> on the <b>${G.STRING_NAMES[s]}</b> string: click the first note of the <b>${w}</b> keystone (note ${w === 'white' ? 3 : 7}).`,
        board: { lo: 0, hi: 15, dots: [] }, clickString: s,
        isCorrect: (cs, cf) => cs === s && G.pcAt(cs, cf) === G.scalePcs(k)[w === 'white' ? 2 : 6],
        solution: targets.flatMap((x) => [{ s, f: x.f, kind: w, text: w === 'white' ? '3' : '7' }, { s, f: x.f2, kind: w === 'white' ? 'white' : 'root', text: w === 'white' ? '4' : '1' }]),
        explain: `In ${G.keyName(k)}, note ${w === 'white' ? 3 : 7} is ${G.spelledScale(k)[w === 'white' ? 2 : 6]}.`,
      };
    }
    const x = pick(ks);
    return {
      type: 'choice', prompt: `Key of <b>${G.keyName(k)}</b>. Is the highlighted pair the white or the black keystone?`,
      board: { lo: 0, hi: 15, dots: [{ s, f: x.f, kind: 'target', text: '' }, { s, f: x.f2, kind: 'target', text: '' }] },
      choices: [{ label: 'White (3 → 4)', value: 'white' }, { label: 'Black (7 → 1)', value: 'black' }], answer: x.type,
      explain: `Those notes are ${G.nameIn(G.pcAt(s, x.f), k)} → ${G.nameIn(G.pcAt(s, x.f2), k)}, numbers ${x.type === 'white' ? '3 → 4' : '7 → 1'} in ${G.keyName(k)}.`,
    };
  }

  /* ---------- Positions (stages 8-10, 13) ---------- */
  function posQuestion(p, k, mode) {
    const dots = G.position(p, k);
    const [lo, hi] = span(dots);
    if (mode === 'deg') {
      const target = pick(dots);
      return { type: 'choice', prompt: `<b>Position ${p}</b> in ${G.keyLabel(k)}. What number is the highlighted note?`, board: { lo, hi, dots: dots.map((d) => ({ ...d, kind: d === target ? 'target' : 'ghost', text: d === target ? '?' : '' })) }, choices: DEG_CHOICES, answer: target.deg, explain: `It's ${G.nameIn(G.pcAt(target.s, target.f), k)}, note ${target.deg} of ${G.keyName(k)} major.` };
    }
    const d = 1 + rnd(7);
    return {
      type: 'click', prompt: `<b>Position ${p}</b> in ${G.keyLabel(k)}. Click any note <b>${d}</b> (${G.spelledScale(k)[d - 1]}).`,
      board: { lo, hi, dots: dots.map((x) => ({ ...x, kind: 'ghost', text: '' })) },
      isCorrect: (cs, cf) => dots.some((x) => x.s === cs && x.f === cf && x.deg === d),
      solution: dots.filter((x) => x.deg === d).map((x) => ({ ...x, kind: 'right', text: String(d) })),
      explain: `Every ${d} in this shape is ${G.spelledScale(k)[d - 1]}.`,
    };
  }
  function whichPosition(k, among) {
    const p = pick(among);
    const dots = G.position(p, k);
    const [lo, hi] = span(dots);
    return { type: 'choice', prompt: `Which position is this? (${G.keyLabel(k)})`, board: { lo, hi, dots: withKinds(dots).map((d) => ({ ...d, text: String(d.deg) })) }, choices: among.map((x) => ({ label: 'Position ' + x, value: x })), answer: p, explain: `Position ${p}: the low E string plays ${dots.filter((d) => d.s === 0).map((d) => d.deg).join(' – ')}.` + (p === 1 ? ' It starts on the minor root (6) and finishes on the black keystone (7 → 1).' : p === 4 ? ' It starts on the white keystone (3 → 4).' : '') };
  }
  function startFret(k) {
    const f = G.pos1StartFret(k);
    const m = G.relMinorFretE(k);
    return {
      type: 'click', prompt: `Key of <b>${G.keyLabel(k)}</b>. Click the <b>minor root on the low E string</b> that anchors position 1.`,
      board: { lo: 0, hi: 15, dots: [] }, clickString: 0,
      isCorrect: (cs, cf) => cs === 0 && cf >= 1 && G.pcAt(0, cf) === G.mod(k + 9),
      solution: [m, m + 12, m - 12].filter((x) => x >= 1 && x <= 15).map((x) => ({ s: 0, f: x, kind: 'root', text: G.relMinorName(k).replace('m', '') })),
      explain: `${G.relMinorName(k)} is the relative minor of ${G.keyName(k)}. Its root on low E (fret ${m}) is the first note of position 1. (The shape reaches one fret lower, to fret ${f}, on the G string.)`,
    };
  }
  function q8() {
    const t = weighted([[40, 'deg'], [35, 'click'], [15, 'start'], [10, 'pent']]);
    if (t === 'start') return startFret(pick([0, 7, 2]));
    if (t === 'pent') return { type: 'choice', prompt: 'Which two numbers do you add to the pentatonic to get the full 7-note scale?', choices: shuffle(['4 and 7', '2 and 6', '3 and 5', '1 and 4'].map((l) => ({ label: l, value: l }))), answer: '4 and 7', explain: 'Pentatonic = the major scale without 4 and 7. Those are the top note of the white keystone and the bottom note of the black keystone.' };
    return posQuestion(1, C, t);
  }
  function q9() {
    const t = weighted([[35, 'deg'], [30, 'click'], [35, 'which']]);
    if (t === 'which') return whichPosition(C, [5, 1, 2]);
    return posQuestion(pick([2, 5]), C, t);
  }
  function q10() {
    const t = weighted([[30, 'deg'], [25, 'click'], [45, 'which']]);
    if (t === 'which') return whichPosition(C, [1, 2, 3, 4, 5]);
    return posQuestion(pick([3, 4]), C, t);
  }

  /* ---------- Stage 11: CAGED, one chord everywhere ---------- */
  const CAGED_CH = ['C', 'A', 'G', 'E', 'D'].map((l) => ({ label: l + ' shape', value: l }));
  const CAGED_MIN_CH = ['Cm', 'Am', 'Gm', 'Em', 'Dm'].map((l) => ({ label: l + ' shape', value: l }));
  function q11() {
    const t = weighted([[35, 'which'], [40, 'see'], [25, 'minor']]);
    const p = 1 + rnd(5);
    if (t === 'which') return { type: 'choice', prompt: `In any major key, which CAGED shape of the <b>1 chord</b> lives inside <b>position ${p}</b>?`, choices: CAGED_CH, answer: G.CAGED_MAJOR[p], explain: 'Up the neck: C shape = position 4, A = 5, G = 1, E = 2, D = 3.' };
    if (t === 'minor') return { type: 'choice', prompt: `Which <b>minor</b> shape of the 6 chord (the relative minor) lives inside <b>position ${p}</b>?`, choices: CAGED_MIN_CH, answer: G.CAGED_MINOR[p], explain: 'Minor shapes: Am = position 4, Gm = 5, Em = 1, Dm = 2, Cm = 3.' };
    const dots = G.position(p, C);
    const tones = G.chordTonesIn(dots, 1, C);
    const [lo, hi] = span(dots);
    return { type: 'choice', prompt: 'These are the C major chord tones inside one position. Which CAGED shape is it?', board: { lo, hi, dots: [...dots.map((d) => ({ ...d, kind: 'ghost', text: '' })), ...tones.map((d) => ({ ...d, kind: d.role === 'R' ? 'root' : 'note', text: d.role }))] }, choices: CAGED_CH, answer: G.CAGED_MAJOR[p], explain: `That's position ${p}, home of the ${G.CAGED_MAJOR[p]} shape.` };
  }

  /* ---------- Stage 12: CAGED, every chord in one spot ---------- */
  function q12() {
    const t = weighted([[50, 'see'], [50, 'shape']]);
    const p = 1;
    const d = 1 + rnd(6);
    const code = G.CAGED_VERTICAL[p][d - 1];
    if (t === 'shape') {
      const pool = ['C', 'A', 'G', 'E', 'D', 'Cm', 'Am', 'Gm', 'Em', 'Dm'].map((l) => ({ label: l + ' shape', value: l }));
      return { type: 'choice', prompt: `Inside <b>position ${p}</b> of C major, which shape plays chord <b>${d}</b> (${G.chordName(d, C)})?`, choices: four({ label: code + ' shape', value: code }, pool), answer: code, explain: `Position ${p}: ` + G.CAGED_VERTICAL[p].slice(0, 6).map((c, i) => `${G.chordName(i + 1, C)} = ${c}`).join(', ') + '.' };
    }
    const dots = G.position(p, C);
    const tones = G.chordTonesIn(dots, d, C);
    const [lo, hi] = span(dots);
    const names = [1, 2, 3, 4, 5, 6].map((x) => ({ label: G.chordName(x, C), value: x }));
    return { type: 'choice', prompt: `Position ${p} in C major. Which chord's tones are highlighted?`, board: { lo, hi, dots: [...dots.map((x) => ({ ...x, kind: 'ghost', text: '' })), ...tones.map((x) => ({ ...x, kind: x.role === 'R' ? 'root' : 'note', text: x.role }))] }, choices: names, answer: d, explain: `${G.chordName(d, C)} (chord ${d}), played with the ${code} shape here.` };
  }

  /* ---------- Stage 13: connecting it all ---------- */
  function q13() {
    const k = pick(ALL_KEYS);
    const t = weighted([[25, 'start'], [20, 'rel'], [20, 'stone'], [15, 'rm'], [20, 'deg']]);
    if (t === 'start') return startFret(k);
    if (t === 'rel') { const ans = G.relMinorName(k); const pool = ALL_KEYS.map((x) => ({ label: G.relMinorName(x), value: G.relMinorName(x) })); return { type: 'choice', prompt: `What is the relative minor of <b>${kn(k)}</b>?`, choices: four({ label: ans, value: ans }, pool), answer: ans, explain: 'The relative minor is chord 6 of the key: count 3 frets down from the major root.' }; }
    if (t === 'stone') {
      const str = pick(['low E', 'A']);
      return { type: 'choice', prompt: `Key of <b>${G.keyName(k)}</b>. You play the <b>${G.relMinorName(k)}</b> barre chord with its root on the <b>${str}</b> string. Which position are you in?`, choices: [{ label: 'Position 1 (black keystone 2–3 frets above the barre)', value: 'black' }, { label: 'Position 4 (white keystone right under the barre)', value: 'white' }], answer: str === 'A' ? 'white' : 'black', explain: 'Relative-minor barre on low E = position 1; the black keystone (7 → 1) is 2 and 3 frets above the barre on both E strings. On the A string = position 4; your barre finger is on the white keystone (3 → 4) on low E.' };
    }
    if (t === 'rm') { const b = G.bestRoadmap(k); return { type: 'choice', prompt: `Key of <b>${G.keyName(k)}</b>. Which chord roadmap keeps you lowest on the neck?`, choices: [{ label: 'Roadmap 1 (root on low E)', value: 1 }, { label: 'Roadmap 2 (root on A)', value: 2 }], answer: b, explain: `${G.keyName(k)}: fret ${G.fretOf(k, 0, 1)} on low E, fret ${G.fretOf(k, 1, 1)} on A. Pick the lower one.` }; }
    return posQuestion(1, k, 'deg');
  }

  /* ---------- Stage 14: jamming in real keys ---------- */
  function q14() {
    const t = weighted([[50, 'key'], [25, 'prog'], [25, 'rm']]);
    const k = pick(ALL_KEYS);
    if (t === 'key') {
      const prog = pick([[1, 5, 6, 4], [6, 4, 1, 5], [1, 4, 5], [2, 5, 1], [6, 2, 5, 1], [1, 6, 4, 5], [4, 1, 5, 6]]);
      const names = prog.map((d) => G.chordName(d, k));
      const pool = ALL_KEYS.map((x) => ({ label: G.keyLabel(x), value: x }));
      return { type: 'choice', prompt: `A song uses these chords: <b>${names.join(' – ')}</b>. What key is it in?`, choices: four({ label: G.keyLabel(k), value: k }, pool), answer: k, explain: `In ${G.keyName(k)} major those are chords ${prog.join(' – ')}. Look for the one chord set where every chord fits.` };
    }
    if (t === 'prog') {
      const prog = pick([[1, 5, 6, 4], [6, 4, 1, 5], [1, 4, 5, 1], [2, 5, 1, 6], [1, 6, 2, 5]]);
      const right = prog.map((d) => G.chordName(d, k)).join(' – ');
      const wrongs = [[...prog].reverse(), prog.map((d) => (d % 7) + 1), prog.map((d) => d === 1 ? 4 : d === 4 ? 1 : d)].map((p) => p.map((d) => G.chordName(d, k)).join(' – ')).filter((x) => x !== right);
      const ch = shuffle([right, ...[...new Set(wrongs)].slice(0, 3)]).map((l) => ({ label: l, value: l }));
      return { type: 'choice', prompt: `Play <b>${prog.join(' – ')}</b> in <b>${kn(k)}</b>. Which chords are those?`, choices: ch, answer: right, explain: `${kn(k)}: ` + [1, 2, 3, 4, 5, 6].map((d) => `${d}=${G.chordName(d, k)}`).join('  ') };
    }
    const b = G.bestRoadmap(k);
    return { type: 'choice', prompt: `A song is in <b>${kn(k)}</b>. Which roadmap do you reach for?`, choices: [{ label: 'Roadmap 1 (root on low E)', value: 1 }, { label: 'Roadmap 2 (root on A)', value: 2 }], answer: b, explain: `${G.keyName(k)}: fret ${G.fretOf(k, 0, 1)} on low E, fret ${G.fretOf(k, 1, 1)} on A. Pick the lower one.` };
  }

  /* ---------- Stage 15: triads ---------- */
  function q15() {
    const k = weighted([[70, C], [30, pick(COMMON_KEYS)]]);
    const d = pick([1, 2, 3, 4, 5, 6]);
    const minor = G.QUAL[d - 1] === 'm';
    const set = pick(G.STRING_SETS.slice(0, 3));
    const v = pick(G.triadVoicings(G.chordRootPc(d, k), minor, set));
    const lo = Math.max(0, Math.min(...v.frets) - 2), hi = Math.min(17, Math.max(...v.frets) + 3);
    const t = weighted([[35, 'quality'], [35, 'inv'], [30, 'bass']]);
    const dots = v.set.map((s, i) => ({ s, f: v.frets[i], kind: t === 'quality' ? (v.roles[i] === 'R' ? 'root' : 'note') : 'note', text: t === 'quality' ? v.roles[i] : '' }));
    if (t === 'quality') return { type: 'choice', prompt: `This triad's root is ${G.nameIn(G.chordRootPc(d, k), k)}. Major or minor?`, board: { lo, hi, dots }, choices: [{ label: 'Major', value: 'M' }, { label: 'Minor', value: 'm' }], answer: minor ? 'm' : 'M', explain: `Count up from the root to the 3rd: ${minor ? '3 semitones (minor 3rd)' : '4 semitones (major 3rd)'}, so it's ${G.chordName(d, k)}. Its notes: ${G.chordPcs(d, k).map((pc) => G.nameIn(pc, k)).join(' ')}.` };
    if (t === 'inv') return { type: 'choice', prompt: `This is ${an(G.chordName(d, k)).replace(/ (.+)$/, ' <b>$1</b>')} triad on the ${G.SET_NAME(v.set)} strings. Which inversion?`, board: { lo, hi, dots }, choices: ['root position', '1st inversion', '2nd inversion'].map((l) => ({ label: l, value: l })), answer: v.inversion, explain: `Lowest note is the ${v.roles[0] === 'R' ? 'root' : v.roles[0] === '3' ? '3rd' : '5th'}: ${v.inversion}. (Notes low to high: ${v.roles.join(' ')})` };
    return { type: 'choice', prompt: `<b>${G.chordName(d, k)}</b> triad. What is its <b>lowest</b> note: root, 3rd or 5th?`, board: { lo, hi, dots }, choices: [{ label: 'Root', value: 'R' }, { label: '3rd', value: '3' }, { label: '5th', value: '5' }], answer: v.roles[0], explain: `Low to high: ${v.roles.join(' – ')} (${v.inversion}).` };
  }

  /* ---------- Stage 16: lead + rhythm, songs, writing ---------- */
  function q16() {
    const t = weighted([[45, 'hand'], [35, 'prog'], [20, 'pull']]);
    if (t === 'hand') {
      const d = 1 + rnd(7);
      const pos = { 1: 5, 5: 5, 2: 1, 6: 1, 3: 2, 4: 2, 7: 2 }[d];
      const where = d === 1 ? ' at fret 3 on the A string' : '';
      return { type: 'choice', prompt: `Roadmap 2 in C. You hold <b>chord ${d} (${G.chordName(d, C)})</b>${where}. Which scale position is under your hand?`, choices: [{ label: 'Position 5', value: 5 }, { label: 'Position 1', value: 1 }, { label: 'Position 2', value: 2 }], answer: pos, explain: 'Fret 3 (chords 1 and 5) sits on position 5. Fret 5 (chords 2 and 6) sits on position 1. Frets 7–8 (chords 3, 4, 7) sit on position 2.' };
    }
    if (t === 'pull') return { type: 'choice', prompt: 'Of these four, which chord pulls hardest back to chord 1?', choices: shuffle([7, 2, 3, 6].map((x) => ({ label: 'Chord ' + x, value: x }))), answer: 7, explain: 'Chord 7 (the m7♭5) has its root one fret under the key\'s root, so it pulls hard back to 1. (Chord 5 pulls to 1 too; it\'s the most common way to end a phrase.) 1, 4, 5 and 6 are the workhorse chords for writing.' };
    return q14();
  }

  /* ---------- Callout helpers for Play drills ---------- */
  const NATURALS = [0, 2, 4, 5, 7, 9, 11];
  const keyCall = (pool) => () => { const k = pick(pool); return { big: G.keyName(k), small: 'major  ·  ' + G.relMinorName(k) }; };

  /* ---------- Figures ---------- */
  const fig = {
    landmarks: () => [{ label: 'Landmarks', spec: { lo: 0, hi: 12, dots: [0, 1].flatMap((s) => G.LANDMARKS.map((f) => ({ s, f, kind: f === 12 ? 'root' : 'note', text: G.PC_SHORT[G.pcAt(s, f)] }))) } }],
    octaves: () => [
      { label: 'Low E → D', spec: { lo: 0, hi: 12, dots: [{ s: 0, f: 3, kind: 'root', text: 'G' }, { s: 2, f: 5, kind: 'note', text: 'G' }, { s: 0, f: 7, kind: 'root', text: 'B' }, { s: 2, f: 9, kind: 'note', text: 'B' }], links: [[0, 3, 2, 5], [0, 7, 2, 9]] } },
      { label: 'A → G', spec: { lo: 0, hi: 12, dots: [{ s: 1, f: 3, kind: 'root', text: 'C' }, { s: 3, f: 5, kind: 'note', text: 'C' }, { s: 1, f: 7, kind: 'root', text: 'E' }, { s: 3, f: 9, kind: 'note', text: 'E' }], links: [[1, 3, 3, 5], [1, 7, 3, 9]] } },
      { label: 'Onto B and e (+1)', spec: { lo: 0, hi: 12, dots: [{ s: 2, f: 5, kind: 'root', text: 'G' }, { s: 4, f: 8, kind: 'note', text: 'G' }, { s: 3, f: 5, kind: 'root', text: 'C' }, { s: 5, f: 8, kind: 'note', text: 'C' }], links: [[2, 5, 4, 8], [3, 5, 5, 8]] } },
    ],

      { label: 'One string', spec: { lo: 4, hi: 17, dots: [{ s: 0, f: 5, kind: 'root', text: 'R' }, ...[...Array(12)].map((_, i) => ({ s: 0, f: 6 + i, kind: [3, 4, 7, 12].includes(i + 1) ? 'note' : 'ghost', text: G.INT_SHORT[i + 1] }))] } },

  /* ---------- Play drills: every call shows WHAT (big) and WHERE (lit-up fretboard), then a check on the board ---------- */
  const SN = (s) => G.STRING_NAMES[s] + ' string';
  const fretsOn = (pc, s, max = 12) => { const a = []; for (let f = 0; f <= max; f++) if (G.pcAt(s, f) === G.mod(pc)) a.push(f); return a; };
  const fretWord = (a) => a.length === 1 ? 'fret ' + a[0] : 'frets ' + a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  const fresh = (st, makeKey, make) => { let r, k, tries = 0; do { r = make(); k = makeKey(r); tries++; } while (k === st.last && tries < 20); st.last = k; return r; };
  const lit = (strings, lo, hi, dots = []) => ({ lo, hi, bands: [].concat(strings), dots });
  const ROLE = { 0: 'R', 3: '♭3', 4: '3', 6: '♭5', 7: '5', 10: '♭7' };
  const roleOf = (rootPc, s, f) => ROLE[G.mod(G.pcAt(s, f) - rootPc)] || '';
  // Barre shapes as fret offsets from the root fret, low E -> high e (null = not played)
  const SHAPES = {
    E: { M: [0, 2, 2, 1, 0, 0], m: [0, 2, 2, 0, 0, 0], dim: [0, 1, 0, 0, null, null] },
    A: { M: [null, 0, 2, 2, 2, 0], m: [null, 0, 2, 2, 1, 0], dim: [null, 0, 1, 0, 1, null] },
  };
  function barreDots(rootPc, s, f, q) {
    const offs = SHAPES[s === 0 ? 'E' : 'A'][q];
    return offs.map((o, str) => o == null ? null : { s: str, f: f + o, text: roleOf(rootPc, str, f + o), kind: roleOf(rootPc, str, f + o) === 'R' ? 'root' : 'right' }).filter(Boolean);
  }
  const ROOT_A = 45; // A on low E, fret 5
  const ghostPos = (p, k) => G.position(p, k).map((d) => ({ ...d, kind: 'ghost', text: '' }));
  // Animated routes (key of C): one step per click, with the finger to use
  const INDEX_FRET = { 4: 1, 5: 2, 1: 5, 2: 7, 3: 10 }; // where the index finger sits in each position
  const fingerFor = (p, f) => (p === 4 ? Math.min(f, 4) : Math.min(4, Math.max(1, f - INDEX_FRET[p] + 1)));
  const posRun = (p, dir) => {
    const up = G.position(p, C).slice().sort((a, b) => a.s - b.s || a.f - b.f).map((x) => ({ s: x.s, f: x.f, finger: fingerFor(p, x.f), grp: p, seg: `Position ${p} ${dir}` }));
    return dir === 'up' ? up : up.reverse();
  };
  const route = (...segs) => segs.flat().filter((x, i, a) => i === 0 || x.s !== a[i - 1].s || x.f !== a[i - 1].f);

  const PLAYS = {
    notes: {
      title: 'Note hunt',
      how: ['Start the metronome. A note appears, and the string to play it on lights up.', 'Find that note on the lit string (frets 0–12) and play it. Say the name out loud. If it\'s there twice (like open and fret 12), either one counts.', 'Halfway through, the answer appears on the fretboard as a check. Try to be there before it shows.', 'Don’t stop to fix mistakes. Move on with the next call.'],
      levels: [{ label: 'Level 1', detail: 'Natural notes (no sharps or flats) on low E and A', bpm: 60, every: 8 }, { label: 'Level 2', detail: 'All 12 notes on low E and A', bpm: 60, every: 8 }, { label: 'Level 3', detail: 'All 12 notes on all six strings', bpm: 70, every: 8 }],
      callout: (lvl, st) => fresh(st, (r) => r.big + r.where, () => {
        const s = lvl < 2 ? pick([0, 1]) : rnd(6);
        const pc = lvl === 0 ? pick(NATURALS) : rnd(12);
        const fr = fretsOn(pc, s);
        return { big: G.PC_LABEL[pc], where: SN(s), answer: fretWord(fr), board: lit(s, 0, 12), reveal: fr.map((f) => ({ s, f, kind: 'right', text: G.PC_SHORT[pc] })) };
      }),
      pass: 'Ten calls in a row where you’re on the right fret before the check appears.',
    },
    intervals: {
      title: 'Interval hop',
      how: ['Your root is the orange <b>A on the low E string, fret 5</b>. Keep coming back to it.', 'Each call names an interval and lights up the string to find it on. Play the root, then the interval note. On one string that\'s one note after the other; at Level 3 (two strings) let both ring together.', 'Say the interval name and listen to the sound. The check shows the exact spot.'],
      levels: [{ label: 'Level 1', detail: 'm3, M3, P4, P5 and octave, up the low E string', bpm: 60, every: 8 }, { label: 'Level 2', detail: 'All 12, up the low E string', bpm: 60, every: 8 }, { label: 'Level 3', detail: 'Across strings: m3, M3, P4, P5 on the A string; M6, m7, octave on the D string', bpm: 70, every: 6 }],
      callout: (lvl, st) => fresh(st, (r) => r.big + r.where, () => {
        const root = [{ s: 0, f: 5, kind: 'root', text: 'R' }];
        if (lvl < 2) {
          const n = lvl === 0 ? pick([3, 4, 5, 7, 12]) : 1 + rnd(12);
          return { big: G.INTERVALS[n], where: 'up the low E string', answer: `fret ${5 + n} (${G.PC_SHORT[G.mod(9 + n)]})`, board: lit(0, 0, 17, root), reveal: [{ s: 0, f: 5 + n, kind: 'right', text: G.INT_SHORT[n] }] };
        }
        const [n, s] = pick([[3, 1], [4, 1], [5, 1], [7, 1], [12, 2], [9, 2], [10, 2]]);
        const f = ROOT_A + n - G.OPEN_MIDI[s];
        return { big: G.INTERVALS[n], where: SN(s), answer: `${SN(s)}, fret ${f} (${G.PC_SHORT[G.mod(9 + n)]})`, board: lit(s, 0, 12, root), reveal: [{ s, f, kind: 'right', text: G.INT_SHORT[n] }] };
      }),
      pass: 'Ten calls in a row, played and named before the check appears.',
    },
    scale: {

      'Don’t memorise all 12 frets. Learn the notes at the <b>dot frets</b> (3, 5, 7, 9, 12) and count up or down from the nearest one. Fret 12 is the open string again, one octave higher.' ],
      table: [['', 'Fret 3', 'Fret 5', 'Fret 7', 'Fret 9', 'Fret 12'], ['Low E', 'G', 'A', 'B', 'C♯', 'E'], ['A', 'C', 'D', 'E', 'F♯', 'A']],
      ex: 'Need D♯ on the low E string? Fret 12 is E, so go one fret down: <b>fret 11</b>.', fig: 0 },
    { h: 'Directions used in this app', p: [
      '<b>Up a string</b> means towards the thin high e string (the one nearest the floor). <b>Down a string</b> means towards the thick low E.',
      '<b>Higher</b>, <b>above</b> or <b>up the neck</b> means a higher fret number, towards the guitar body. <b>Lower</b> or <b>below</b> means a lower fret number, towards the headstock.' ] },
    { h: 'The octave shape', p: [
      'An <b>octave</b> is the same note, just higher. There’s a shape that finds it instantly: from any note, go <b>up two strings and two frets higher</b>.',
      'There’s one twist. If you land on the <b>B or high e</b> string, go <b>three</b> frets higher instead. The B string is tuned one fret lower than the pattern, so everything past it shifts by one.' ],
      ex: 'G on low E fret 3 → two strings up, two frets higher → <b>D string fret 5 is also G</b>.<br>G on D string fret 5 → up two strings to B, three frets higher → <b>B string fret 8 is G</b>.', fig: 1 },
    { h: 'Naming notes on D, G, B and high e', p: [
      'Run the octave shape <b>backwards</b>: go two strings back towards low E and two frets lower (three frets if you’re starting on B or high e). Repeat until you land on low E or A, where you know the landmarks.',
      'High e is the easy one: it has exactly the same notes as low E, fret for fret.' ],
      ex: 'What’s on the B string, fret 6? Back three frets, down two strings: <b>D string fret 3</b>. Back two more, down two: <b>low E fret 1 = F</b>. So it’s F.' },
    { h: 'Why this matters', p: [
      'Every system in this course starts with "find the root on low E or A". If finding notes is slow, everything after it is slow. Speed isn’t the goal yet. A reliable method you never have to guess at is.' ] },
  ],

  intervals: [
    { h: 'What an interval is', p: [
      'An interval is the <b>distance between two notes</b>, counted in frets. One fret is a <b>semitone</b> (also called a half step). Two frets is a <b>tone</b> (a whole step).',
      'Each distance has a name. The names sound technical, but they just describe how far apart two notes are, and each one has its own sound.' ] },
    { h: 'All 12, from the root', p: ['Learn the four in the next section first. The quiz drills all 12, so come back to this table whenever you need it.'],
      table: [['Frets', 'Name', 'Short'], ['1', 'minor 2nd', 'm2'], ['2', 'major 2nd', 'M2'], ['3', 'minor 3rd', 'm3'], ['4', 'major 3rd', 'M3'], ['5', 'perfect 4th', 'P4'], ['6', 'tritone', 'TT'], ['7', 'perfect 5th', 'P5'], ['8', 'minor 6th', 'm6'], ['9', 'major 6th', 'M6'], ['10', 'minor 7th', 'm7'], ['11', 'major 7th', 'M7'], ['12', 'octave', '8va']] },
    { h: 'The four that really matter', p: [
      '<b>Minor 3rd (3 frets)</b>: the "sad" sound. It’s what makes a chord minor.',
      '<b>Major 3rd (4 frets)</b>: the "happy" sound. It’s what makes a chord major.',
      '<b>Perfect 5th (7 frets)</b>: strong and neutral. Root + 5th is a power chord.',
      '<b>Octave (12 frets)</b>: the same note, higher.' ],
      ex: 'Put a finger on A (low E, fret 5). Play it, then fret 8 (C): that’s a <b>minor 3rd</b>. Now A, then fret 9 (C♯): a <b>major 3rd</b>. That one fret is the whole difference between minor and major.', fig: 0 },
    { h: 'Across strings: small shapes instead of big stretches', p: [
      'Along one string, intervals mean big stretches. Across two strings they become tiny shapes. From a root on low E or A, on the next string up:',
      'Same fret = <b>perfect 4th</b>. Two frets higher = <b>perfect 5th</b> (the power chord shape). One fret lower = <b>major 3rd</b>. Two frets lower = <b>minor 3rd</b>. One fret higher = <b>tritone</b> (the tense one).',
      'Two strings up: two frets higher = <b>octave</b>. Same fret = <b>minor 7th</b>. One fret lower = <b>major 6th</b>.',
      'Same rule as the octave shape: when the shape crosses from G to B, add one fret.' ],
      ex: 'From A (low E fret 5): A string fret 5 = D (4th), fret 7 = E (5th), fret 4 = C♯ (major 3rd), fret 3 = C (minor 3rd).<br>D string fret 7 = A (octave), fret 5 = G (minor 7th), fret 4 = F♯ (major 6th).' },
    { h: 'Why this matters', p: [
      'Chords are built from intervals (you’ll see this in stage 15), and words like "the 3rd" and "the 5th" come up all through the course. For now: know the names, and know those four sounds.' ] },
  ],

  scale: [
    { h: 'A scale picks 7 notes out of 12', p: [
      'Play all 12 notes in a row and it sounds aimless. A <b>scale</b> picks 7 of them that sound good together. The <b>major scale</b> is the one you already know as "do re mi fa so la ti do".' ] },
    { h: 'The formula: 2-2-1-2-2-2-1', p: [
      'Start on any note, then move up by these numbers of frets: <b>2, 2, 1, 2, 2, 2, 1</b>. Remember it like a phone number: <b>221-2221</b>. Do that from any note and you get the major scale of that note.' ],
      ex: '<b>C major</b>: C (+2) D (+2) E (+1) F (+2) G (+2) A (+2) B (+1) C. All plain letters.<br><b>G major</b>: G A B C D E <b>F♯</b> G. The formula forces the F♯: E to F is only one fret, so you need one more.' },
    { h: 'Give the notes numbers', p: [
      'Number the notes 1 to 7. In C: C = 1, D = 2, E = 3 … B = 7. In G: G = 1, A = 2 … F♯ = 7.',
      'The number tells you the <b>job</b> a note does in the key, not its name. That’s why the same tune can be played in any key: the numbers stay the same, only the names change.' ],
      ex: 'Happy Birthday starts on the numbers <b>5 5 6 5 1 7</b>. In C that’s G G A G C B. In G it’s D D E D G F♯. Same tune, different key.' },
    { h: 'Naming the notes: each letter once', p: [
      'A major scale uses <b>each letter A–G exactly once</b>, in order. That rule decides whether a note is called sharp or flat. Count the frets with the formula, then give each note the next letter.' ],
      ex: '<b>F major</b>: F G A <b>B♭</b> C D E. (Not A♯: A is already used, and B is still missing.)<br><b>F♯ major</b>: F♯ G♯ A♯ B C♯ D♯ <b>E♯</b>. E♯ is the same fret as F, but F♯ already uses the letter F.' },
    { h: 'See it on one string', p: [
      'Play a major scale along a single string and the formula becomes visible: mostly 2-fret gaps, with two 1-fret gaps. Those two always fall between <b>3 → 4</b> and <b>7 → 1</b>. Remember that: in stage 7 they become your landmarks (the keystones).',
      'On the diagram the numbers are the scale notes. Orange = 1, white = 3 and 4, black = 7.' ], fig: 0 },
    { h: 'Why this matters', p: [
      'Everything from here uses these numbers. Guitarists say "play the 4 chord" or "land on the 3" instead of note names, because numbers work in every key.' ] },
  ],

  chords: [
    { h: 'Every key has 7 chords', p: [
      'Build a chord on each note of the major scale, using only notes from that scale, and you get the 7 chords of the key. Because they share the same notes, they all sound like they belong together. That’s why songs mostly use them.' ] },
    { h: 'The pattern never changes', p: [
      'In every major key the chord types follow the same pattern: <b>1, 4 and 5 are major. 2, 3 and 6 are minor. 7 is diminished.</b>' ],
      table: [['Number', '1', '2', '3', '4', '5', '6', '7'], ['Type', 'major', 'minor', 'minor', 'major', 'major', 'minor', 'dim'], ['Key of C', 'C', 'Dm', 'Em', 'F', 'G', 'Am', 'Bm7♭5'], ['Key of G', 'G', 'Am', 'Bm', 'C', 'D', 'Em', 'F♯m7♭5'], ['Key of D', 'D', 'Em', 'F♯m', 'G', 'A', 'Bm', 'C♯m7♭5']],
      ex: 'Any other key: write out its major scale (stage 3), then add the types in this order. The chord names use the scale’s own spelling (so in F, chord 4 is B♭).' },
    { h: 'The odd one: chord 7', p: [
      'Chord 7 is tense and unstable. We play it as a <b>m7♭5</b> chord (also called half-diminished). It’s rarely used, and when it is, it usually leads straight back to chord 1.' ] },
    { h: 'Four shapes for chords 1–6, one for chord 7', p: [
      'Barre chords are movable, so one shape plays any chord. Which shape you use depends on which string the root is on:',
      '<b>Root on low E → E-shape</b> (the open E chord, moved up with a barre). <b>Root on A → A-shape</b> (the open A chord, moved up). Each has a major and a minor version. The minor version changes just one finger.',
      'Every note is on both strings, so you can always choose. Pick the root closer to where your hand already is. (In the drill, the lit string tells you which.) If the root is the open string (E on low E, A on the A string), play the barre at fret 12.',
      '<b>Chord 7</b> uses the <b>m7♭5 shape</b> (the last two diagrams): four strings only, root on low E or A. Mute the other strings with your fretting hand.' ],
      ex: '<b>D minor</b>: D is on the A string at fret 5, so play an <b>A-shape minor</b> barre at fret 5.<br><b>G major</b>: G is on low E at fret 3, so play an <b>E-shape major</b> barre at fret 3.', fig: 0 },
    { h: 'The relative minor', p: [
      'Chord 6 is special. It’s the <b>relative minor</b> of the key (Am in C, Em in G). It uses exactly the same notes. A song using these chords feels major if it keeps coming home to chord 1, and minor if it keeps coming home to chord 6.' ] },
    { h: 'Why this matters', p: [
      'Know the pattern and you can write a progression in any key, and quickly work out what key a song is in from its chords.' ] },
  ],

  rm1: [
    { h: 'The problem roadmaps solve', p: [
      'Played as open chords, the 7 chords of a key are scattered all over the neck, and some keys are awkward. A <b>chord roadmap</b> is a fixed layout that puts all 7 chords within a few frets, using barre chords. Learn it once and it works in every key.' ] },
    { h: 'The layout', p: [
      'Put <b>chord 1 on the low E string</b>, at the key’s root.',
      '<b>Chords 2 and 3</b> are the next two notes along the low E string (2 frets apart each).',
      '<b>Chords 4, 5 and 6</b> sit directly <b>above</b> 1, 2 and 3, on the A string.',
      '<b>Chord 7</b> is on the A string, two frets past chord 6.' ],
      ex: 'Key of G: G at low E fret 3, Am at fret 5, Bm at fret 7. Right above them on the A string: C at fret 3, D at fret 5, Em at fret 7. Then F♯m7♭5 at A string fret 9.', fig: 0 },
    { h: 'The shape follows the string', p: [
      'Roots on low E use <b>E-shape</b> barre chords. Roots on the A string use <b>A-shape</b>. Major or minor comes from the number: 1, 4, 5 major; 2, 3, 6 minor; 7 m7♭5. Faded dots on the diagram are shortcuts (see below).' ] },
    { h: 'Moving it to another key', p: [
      'Slide the whole map so chord 1 sits on the new key’s root on low E. Nothing else changes.',
      'Roadmap 1 is best for keys whose root is low on the E string: <b>F, F♯, G, A♭, A</b>. Other keys push it high up the neck. That’s what Roadmap 2 is for.' ],
      ex: 'Key of A: chord 1 goes to low E fret 5. So Bm is at fret 7, C♯m at fret 9, D at A string fret 5, and so on.' },
    { h: 'Shortcuts', p: [
      'Some chords also have a closer spot. Chord <b>7</b> sits one fret behind chord 1 on low E. Chord <b>3</b> sits one fret behind chord 4 on the A string. Chord <b>4</b> also sits on low E, five frets above chord 1. Use whichever is closest to where your hand already is.' ] },
    { h: 'Why this matters', p: [
      'A progression written in numbers ("1 – 5 – 6 – 4") becomes instantly playable in any key, and changing key is just sliding your hand.' ] },
  ],

  rm2: [
    { h: 'Why a second roadmap', p: [
      'In some keys Roadmap 1 sits high on the neck. In C, chord 1 would be at low E fret 8. <b>Roadmap 2</b> puts chord 1 on the <b>A string</b> instead, so those keys sit low and comfortable.' ] },
    { h: 'The layout', p: [
      'Put <b>chord 1 on the A string</b>, at the key’s root.',
      '<b>Chords 2, 3 and 4</b> go along the A string: up 2 frets, 2 frets, then 1 fret.',
      '<b>Chords 5, 6 and 7</b> sit at the <b>same frets</b> as 1, 2 and 3, on the low E string (the thicker string next to A). Chord 1 appears again on low E, at the same fret as chord 4.',
      'Shortcut (the faded dot): chord 4 also sits on low E, two frets below chord 5.' ],
      ex: 'Key of C: C at A string fret 3, Dm at 5, Em at 7, F at 8. On low E at the same frets: G at fret 3, Am at 5, Bm7♭5 at 7, and C again at 8.', fig: 0 },
    { h: 'Which roadmap for which key?', p: [
      'Find the key’s root on the low E string and on the A string. <b>Use the roadmap whose root is lower on the neck.</b> Ignore open strings: you can’t barre at fret 0, so count an open-string root as fret 12.',
      'The quiz sometimes asks for a roadmap in a key where the other one would be lower. That’s on purpose: both roadmaps work in every key.' ],
      ex: 'C: low E fret 8 vs A string fret 3 → <b>Roadmap 2</b>.<br>G: low E fret 3 vs A string fret 10 → <b>Roadmap 1</b>.<br>E: low E fret 12 vs A string fret 7 → <b>Roadmap 2</b>.' },
    { h: 'Think in numbers', p: [
      'Once both roadmaps are in your hands, you don’t need chord names. "6 – 4 – 1 – 5 in E♭" is just a pattern: find E♭, pick the roadmap, play the numbers.' ] },
    { h: 'Why this matters', p: ['Between the two roadmaps, every key has a comfortable spot for all 7 chords. That’s your rhythm-guitar foundation for the rest of the course.'] },
  ],

  keystones: [
    { h: 'Back to the scale on one string', p: [
      'Play a major scale along one string and you get mostly 2-fret steps. Only two steps are 1 fret: between notes <b>3 → 4</b> and <b>7 → 1</b>.' ] },
    { h: 'Give them names', p: [
      'Call them the <b>white keystone</b> (3 → 4) and the <b>black keystone</b> (7 → 1). The colours are just labels. In this app, white dots are 3 and 4, the black dot is 7, and the orange dot is 1.' ] },
    { h: 'Why they help', p: [
      'In a long row of evenly spaced notes it’s easy to lose track of where you are. The two 1-fret pairs stand out. Spot one and you know exactly which numbers you’re on, so everything around it falls into place. Think of them as lighthouses.' ],
      ex: 'G major on the high e string: the black keystone is at frets 2–3 (F♯ → G). The white keystone is at frets 7–8 (B → C).', fig: 0 },
    { h: 'Finding them in any key', p: [
      'Find the key’s root on the string. The <b>black keystone</b> is the fret just below the root, then the root itself (7 → 1). The <b>white keystone</b> is 4 and 5 frets above the root (3 → 4).',
      'Each pair repeats 12 frets higher, so you’ll often see two copies on a string. Either one is right. If the root is the open string, use its copy at fret 12 (black keystone = frets 11 → 12).' ],
      ex: 'D major on high e: D is at fret 10. Black keystone = frets 9 → 10. White keystone = frets 14 → 15, or the same 12 frets lower: frets 2 → 3.' },
    { h: 'Coming up: shapes sit on keystones', p: [
      'The scale shapes in the next stages are anchored to these. On the E strings, <b>position 1 finishes on the black keystone</b> (it plays 6 – 7 – 1) and <b>position 4 starts on the white keystone</b> (it plays 3 – 4 – 5). Find a keystone and you’ve found a shape.' ] },
    { h: 'The pentatonic connection', p: [
      'The pentatonic scale is the major scale with notes <b>4 and 7</b> removed: one note from each keystone. That’s why the pentatonic has no 1-fret steps. It’s easy to play, but it hides your landmarks. That’s why this course has you learn the full 7-note shapes.' ] },
  ],

  pos1: [
    { h: 'What a "position" is', p: [
      'A <b>position</b> is a scale shape you play with your hand in one spot, covering about 4 or 5 frets across all six strings. There are five positions, and together they cover the whole neck. You’ll learn them one at a time, starting with the most important one.' ] },
    { h: 'Position 1', p: [
      'Maybe you know the minor pentatonic "box" (if not, set the diagram to "Pentatonic only" to see it). Position 1 is that box <b>plus the two missing notes (4 and 7)</b>, which makes it the full 7-note scale.',
      'In C major / A minor it covers <b>frets 4 to 8</b>. It starts on <b>A at low E fret 5</b> and ends on <b>C at high e fret 8</b>. Use the toggle on the diagram to compare the pentatonic with the full scale.',
      '<b>Fingering:</b> one finger per fret. Index on fret 5, middle 6, ring 7, pinky 8. The only note on fret 4 (G string) is played by stretching your index back one fret. So the shape reaches from fret 4 to 8, but its first note is A at fret 5.' ], fig: 0 },
    { h: 'One shape, major and minor', p: [
      'C major and A minor use exactly the same notes (A minor is C’s relative minor), so they share this shape. Whether it sounds major or minor depends on which note feels like home (C or A) and the chords playing underneath.' ] },
    { h: 'Placing it in any key', p: [
      'The first note on the low E string is always the <b>relative minor root</b> (chord 6 of the key, 3 frets below the major root). Find that and the shape drops into place.' ],
      ex: 'C major / A minor: A at low E <b>fret 5</b>.<br>G major / E minor: E at low E <b>fret 12</b> (not open: the shape needs one fret below its first note).<br>D major / B minor: B at low E <b>fret 7</b>.<br>Jam in C for now. Only Level 3 of the drill and a few quiz questions use G and D.' },
    { h: 'Home base: go deep, not wide', p: [
      'Instead of learning all five shapes at once, master this one until you don’t have to think. Then, when you get lost mid-song, you always have a safe place to come back to. Everything else in the course plugs into it.' ] },
  ],

  pos25: [
    { h: 'Positions share walls', p: [
      'Each position starts where the previous one ends. Neighbouring shapes overlap by a column of notes, so they lock together like puzzle pieces.' ] },
    { h: 'Position 2 above, position 5 below', p: [
      'In C major / A minor: <b>position 5</b> sits just below position 1 (frets 2–6) and starts on <b>G at low E fret 3</b>. <b>Position 2</b> sits just above (frets 7–10) and starts on <b>B at low E fret 7</b>.',
      'They hold exactly the same notes as position 1, just in a different spot. Flip between them on the diagram to see the overlap.',
      '<b>Fingering:</b> position 5: index on fret 2, pinky on 5, and stretch the pinky up to fret 6 on the B string. Position 2: index 7, middle 8, ring 9, pinky 10, no stretch.' ], fig: 0 },
    { h: 'Moving between them', p: [
      'You don’t jump between shapes. You <b>slide</b>. Slide the finger on your last note to the next scale note on the same string (usually 2 frets, 1 at a keystone) and your hand lands in the next shape.' ],
      ex: 'In position 1, play the G string at fret 7 (D), then slide up to fret 9 (E). Your hand is now sitting in position 2.' },
    { h: 'Why this matters', p: [
      'Three connected shapes give you about 8 frets of room. Your phrases no longer have to stop where the box ends.' ] },
  ],

  pos34: [
    { h: 'The last two shapes', p: [
      'Fingering: position 4 uses open strings plus index 1, middle 2, ring 3. Position 3: index 10, middle 11, ring 12, pinky 13, and stretch the index back to fret 9 on the D and G strings.',
      'In C major / A minor, <b>position 4</b> sits below position 5. In C it’s the open-string shape (frets 0–3), starting on the open low E. <b>Position 3</b> sits above position 2 (frets 9–13), starting on <b>D at low E fret 10</b>.' ], fig: 0 },
    { h: 'The loop around the neck', p: [
      'Going up the neck in C: <b>4 (frets 0–3) → 5 (2–6) → 1 (4–8) → 2 (7–10) → 3 (9–13) → 4 again (12–15)</b>. After 3 comes 4 again, 12 frets higher. Same the other way: any shape also exists 12 frets lower or higher, if it fits on the neck.' ] },
    { h: 'Position 4 starts on the white keystone', p: [
      'Position 1 finishes on the black keystone. Position 4 does the opposite: on both E strings it plays 3 – 4 – 5, so it <b>starts on the white keystone (3 → 4)</b>. In C that’s E → F at frets 0–1 (or 12–13).' ] },
    { h: 'The big picture', p: [
      'All five positions are the <b>same 7 notes</b>. Put them together and the whole neck is one big scale. The positions are just five handy ways to grab it.' ], fig: 1 },
    { h: 'Priorities', p: ['Position 1 is home. Positions 2 and 5 come next. Positions 3 and 4 are worth knowing but get the least time.'] },
  ],

  cagedH: [
    { h: 'The five shapes you already know', p: [
      '<b>C, A, G, E and D</b> are the five open chord shapes most players learn first. Every major chord can be played with any of these five shapes, just moved up the neck.' ] },
    { h: 'Barre chords are CAGED too', p: [
      'An E-shape barre chord is the open E chord moved up, with your finger acting as the nut. An A-shape barre is the open A chord moved up. You’ve been using CAGED all along.' ] },
    { h: 'One chord, five shapes, always in the same order', p: [
      'Play one chord up the neck and the shapes always come in the order <b>C → A → G → E → D</b>, then repeat.' ],
      ex: 'C major: <b>C shape</b> (open C) → <b>A shape</b> (barre at fret 3) → <b>G shape</b> (root on low E fret 8) → <b>E shape</b> (barre at fret 8) → <b>D shape</b> (root on D string fret 10) → C shape again at fret 12.', fig: 0 },
    { h: 'Each shape lives inside a position', p: [
      'This is the useful part. Each shape sits inside one scale position: <b>C shape = position 4, A = 5, G = 1, E = 2, D = 3</b>. Every position now has a familiar chord picture inside it, a landmark to recognise it by.' ] },
    { h: 'A new meaning for 3 and 5', p: [
      'On these diagrams, <b>R, 3 and 5</b> are the <b>chord’s</b> root, 3rd and 5th, counted up from the chord’s own root. They are not the key’s note numbers from stage 3.' ],
      ex: 'Am in C major: R = A, 3 = C, 5 = E. As key numbers those would be 6, 1 and 3.<br>On a minor chord the "3" is its minor 3rd (the ♭3 from the stage 4 barre diagrams). On the diminished chord 7, the "5" is its ♭5.' },
    { h: 'Minor works the same way', p: [
      'The relative minor chord (Am in C) also has five shapes in every position: <b>Am shape = position 4, Gm = 5, Em = 1, Dm = 2, Cm = 3</b>. Some are awkward to play in full. You only need to see them.' ], fig: 1 },
    { h: 'Why this matters', p: [
      'When soloing over the key’s main chord, the chord’s notes (root, 3rd, 5th) are the safest, strongest notes to land on, and now you can see them inside whatever position you’re in.' ] },
  ],

  cagedV: [
    { h: 'The opposite of stage 11', p: [
      'Stage 11 played one chord in every position. This stage stays in <b>one position</b> and finds <b>all 7 chords</b> of the key inside it.' ] },
    { h: 'Inside position 1 of C major', p: ['Each chord of the key is hiding in the shape as a CAGED shape. Tap through the chords on the diagram.'],
      table: [['Chord', 'C (1)', 'Dm (2)', 'Em (3)', 'F (4)', 'G (5)', 'Am (6)', 'Bdim (7)'], ['Shape', 'G', 'Am', 'Cm', 'C', 'D', 'Em', 'none: just B D F']],
      ex: 'Chord 7 is shown as its three notes only, B D F (B diminished, the Bm7♭5 from before without its A). It has no neat CAGED shape: find B, D and F wherever they fall inside position 1.<br>As in stage 11, R, 3 and 5 are each chord’s own root, 3rd and 5th.', fig: 0 },
    { h: 'Chord tones', p: [
      'Each chord’s three notes (root, 3rd, 5th) are its <b>chord tones</b>. When the chord changes in a song, landing on one of the new chord’s tones makes your solo sound connected to the music instead of just running a scale.' ] },
    { h: 'Light touch', p: ['You don’t need to strum these as chords. Some are awkward. The goal is to <b>see</b> them, so start with position 1 only.'] },
  ],

  connect: [
    { h: 'Four systems, one neck', p: [
      'You now have four tools: <b>roadmaps</b> for chords, <b>keystones</b> as landmarks, <b>positions</b> for scales and <b>CAGED</b> for chord shapes inside the positions. They all describe the same neck, so they fit together perfectly.' ], fig: 0 },
    { h: 'Roadmap 2 sits on top of positions 5, 1 and 2', p: [
